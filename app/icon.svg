<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2e57" />
      <stop offset="0.52" stop-color="#1490e6" />
      <stop offset="1" stop-color="#41b8ff" />
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30" />
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.6" stop-color="#001126" stop-opacity="0" />
      <stop offset="1" stop-color="#001126" stop-opacity="0.28" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="8" fill="url(#bg)" />
  <rect width="32" height="32" rx="8" fill="url(#shade)" />
  <rect width="32" height="32" rx="8" fill="url(#gloss)" />
  <rect x="0.6" y="0.6" width="30.8" height="30.8" rx="7.4" fill="none" stroke="#ffffff" stroke-opacity="0.22" />

  <!-- text lines -->
  <g fill="#ffffff">
    <rect x="8.5" y="10.1" width="10" height="2.6" rx="1.3" />
    <rect x="8.5" y="15" width="15" height="2.6" rx="1.3" fill="#ffffff" fill-opacity="0.9" />
    <rect x="8.5" y="19.9" width="11.5" height="2.6" rx="1.3" fill="#ffffff" fill-opacity="0.9" />
  </g>

  <!-- share node accent at the end of the first line -->
  <circle cx="21.6" cy="11.4" r="3.1" fill="#0b2e57" />
  <circle cx="21.6" cy="11.4" r="2.5" fill="#7fe0ff" />
</svg>
